name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The repo ships package-lock.json — npm ci, not pnpm (pnpm-lock.yaml was
      # removed, so `pnpm install --frozen-lockfile` fails outright).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build must succeed without secrets — the chatbot degrades gracefully.
          NEXT_PUBLIC_SITE_URL: https://me.hanpeng.xyz

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (production deps)
        run: npm audit --omit=dev || true
